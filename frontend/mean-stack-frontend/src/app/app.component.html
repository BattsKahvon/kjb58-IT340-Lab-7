<!-- =========================
     NAV BAR (ONLY WHEN LOGGED OUT)
     ========================= -->
<nav class="app-nav" *ngIf="!isLoggedIn">
  <span class="app-logo">The Modern Green Book</span>

  <div class="nav-actions">
    <button class="login-nav-button" (click)="openLoginPopup()">Log In</button>
    <button class="register-button" (click)="openRegisterPopup()">Register</button>
  </div>
</nav>

<!-- =========================
     ROUTED CONTENT
     ========================= -->
<router-outlet></router-outlet>

<!-- =========================
     HOME PAGE (ROOT ONLY)
     ========================= -->
<div *ngIf="!isLoggedIn && router.url === '/'">

  <!-- HERO -->
  <div class="hero">
    <div class="hero-overlay">
      <div class="content">
        <h1>Explore the Modern Green Book</h1>
        <p>
          Connecting communities and highlighting Black-owned businesses
          across the nation.
        </p>

        <!-- LOGIN CTA -->
        <button class="login-cta" (click)="openLoginPopup()">
          Log In
        </button>
      </div>
    </div>
  </div>

  <!-- INFO SECTION -->
  <div class="main-section">
    <h2>Discover Safe & Welcoming Spaces</h2>
    <p>
      Your guide to empowerment, history, and community — all in one platform.
    </p>

    <!-- EXPLORE AS GUEST (MOVED HERE) -->
    <button
      class="explore-guest-btn"
      (click)="goToMap()">
      Explore as Guest
    </button>
  </div>

</div>

<!-- =========================
     LOGIN POPUP
     ========================= -->
<div class="popup-container" *ngIf="isLoginPopupVisible">
  <div class="popup-content">
    <span class="close-button" (click)="closeLoginPopup()">&times;</span>

    <h2>Log In</h2>

    <form (submit)="loginUser(); $event.preventDefault()">
      <div class="form-group">
        <label>Username</label>
        <input id="username" required />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input id="password" type="password" required />
      </div>

      <button class="login-button" type="submit">
        Log In
      </button>
    </form>
  </div>
</div>

<!-- =========================
     REGISTER POPUP
     ========================= -->
<div class="popup-container" *ngIf="isRegisterPopupVisible">
  <div class="popup-content">
    <span class="close-button" (click)="closeRegisterPopup()">&times;</span>

    <h2>Register</h2>

    <form (submit)="registerUser(); $event.preventDefault()">
      <div class="form-group">
        <label>Username</label>
        <input id="reg-username" required />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input id="reg-email" required />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input id="reg-password" type="password" required />
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input id="reg-confirm-password" type="password" required />
      </div>

      <button class="register-submit-button" type="submit">
        Register
      </button>
    </form>
  </div>
</div>
